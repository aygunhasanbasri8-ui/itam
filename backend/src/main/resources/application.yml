spring:
  application:
    name: itam

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/itam}
    username: ${DB_USER:itam}
    password: ${DB_PASSWORD:itam}
    hikari:
      maximum-pool-size: 10
      pool-name: itam-pool

  jpa:
    hibernate:
      # Semayi yalnizca Flyway yonetir. validate, entity ile migration'in
      # sessizce ayrismasini engeller: uyusmazlikta uygulama acilmaz.
      ddl-auto: none
    # Varsayilani true. Kapatilmazsa lazy loading controller katmaninda
    # tetiklenir ve N+1 sorgular fark edilmeden uretime tasinir

    open-in-view: false
    properties:
      hibernate:
        # Toplu islem ve ice aktarim performansi icin (Faz 5 ve Faz 7).
        # Entity'lerde allocationSize = 50 olmali.
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        # Envers ayarlari
        envers.audit_table_suffix: _aud
        # Varsayilan false yalnizca birincil anahtari saklar; silme aninda
        # "ne silindi" sorusu cevapsiz kalir.
        envers.store_data_at_delete: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  messages:
    basename: messages
    encoding: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    tr.com.nkolay.itam: INFO
